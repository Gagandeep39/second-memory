# =============================================================================
# REQUIRED SECRETS (Settings → Secrets and variables → Actions → New secret)
# =============================================================================
# KEYSTORE_BASE64                  - Base64-encoded release keystore file
#                                    Generate with: base64 -i my-release-key.jks | pbcopy
# SIGNING_KEY_STORE_PASSWORD       - Password for the keystore file
# SIGNING_KEY_ALIAS                - Key alias inside the keystore
# SIGNING_KEY_PASSWORD             - Password for the key alias
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON - Service account JSON key (plain text content of the .json file)
#                                    1. Google Cloud Console → IAM & Admin → Service Accounts → Create (With Edit role)
#                                    2. Create a JSON key for it and copy its contents here
#                                    3. Google Play Console → Setup → API access → Grant access
#                                       to the service account to create releases
#
# =============================================================================
# REQUIRED VARIABLES (update directly in this file)
# =============================================================================
# packageName (release_playstore job) - Your app's application ID e.g. com.example.myapp
# track       (release_playstore job) - Play Store track: internal | alpha (closed) | beta (open) | production
#
# =============================================================================
# REQUIRED FILES IN REPOSITORY
# =============================================================================
# app/build.gradle.kts  - Must contain: versionName = "x.y.z"
# CHANGELOG.md          - Must contain sections headed: ## x.y.z
#
# =============================================================================

name: Build & Deploy to Github releases and Play store

on:
  push:
    branches:
      - develop

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

  changelog:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Extract Changelog for Version
        id: changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          NOTES=$(awk -v ver="## ${VERSION}" 'found && /^## / {exit} found {print} $0==ver {found=1}' CHANGELOG.md | sed '/^[[:space:]]*$/d' | head -c 500)
          if [ -z "$NOTES" ]; then
            NOTES="No Changelog found."
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" > RELEASE_CHANGELOG.md
          mkdir -p whatsNew
          echo "$NOTES" > whatsNew/whatsnew-en-US
      - name: Upload Changelog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: RELEASE_CHANGELOG.md
      - name: Upload whatsNew Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whats-new
          path: whatsNew/

  build:
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 -d > app/my-release-key.jks
      - name: Set up signing environment variables
        run: |
          echo "SIGNING_KEY_PATH=$(pwd)/app/my-release-key.jks" >> $GITHUB_ENV
          echo "SIGNING_KEY_STORE_PASSWORD=${{ secrets.SIGNING_KEY_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Release Bundle & APK
        run: |
          ./gradlew bundleRelease
          ./gradlew assembleRelease
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

  release_github:
    runs-on: ubuntu-latest
    needs: [build, version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/
      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/
      - name: Download Changelog Artifact
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .
      - name: Create and Push Tag for Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
      - name: Create GitHub Release (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          prerelease: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          body_path: RELEASE_CHANGELOG.md

  release_playstore:
    runs-on: ubuntu-latest
    needs: [build, version, release_github]
    steps:
      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/
      - name: Download whatsNew Artifact
        uses: actions/download-artifact@v4
        with:
          name: whats-new
          path: whatsNew/
      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.secondmemory
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          whatsNewDirectory: whatsNew
